{{ define "main" }}
  <h1 style="font-weight: 300; font-size: 2.4rem; margin-bottom: 0.2em;">{{ .Site.Title }}</h1>
  {{ .Content }}
  <h2>Recent Posts</h2>
  {{ range (where .Site.RegularPages "Section" "posts").ByDate.Reverse | first 5 }}
    <p>
      <span style="color: var(--text-muted);">{{ .Date.Format "Jan 2, 2006" }}</span>
      <a href="{{ .Permalink }}">{{ .Title }}</a>
    </p>
  {{ end }}
{{ end }}
