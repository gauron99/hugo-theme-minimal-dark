<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Title }}{{ end }}">
<title>{{ if not .IsHome }}{{ .Title }} | {{ end }}{{ .Site.Title }}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:         #282624;
    --surface:    #322f2c;
    --text:       #b5ada2;
    --text-muted: #706b63;
    --accent:     #c4956a;
    --border:     #3a3734;
  }

  *,
  *::before,
  *::after {
    box-sizing: border-box;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Sora', sans-serif;
    font-size: 17px;
    line-height: 1.7;
    max-width: 65ch;
    margin: 0 auto;
    padding: 15vh 1rem 4rem;
  }

  a {
    color: var(--accent);
    text-decoration: none;
  }

  a:hover {
    text-decoration: underline;
  }

  h1, h2, h3, h4, h5, h6 {
    font-weight: 400;
    color: var(--text);
    line-height: 1.3;
    margin-top: 1.5em;
    margin-bottom: 0.5em;
  }

  h1 { font-size: 1.8rem; }
  h2 { font-size: 1.4rem; }
  h3 { font-size: 1.2rem; }

  p {
    margin: 1em 0;
  }

  code {
    background: var(--surface);
    padding: 0.15em 0.3em;
    border-radius: 3px;
    font-family: monospace;
    font-size: 0.9em;
  }

  pre {
    background: var(--surface);
    padding: 1em;
    border-radius: 6px;
    overflow-x: auto;
    line-height: 1.5;
  }

  pre code {
    background: none;
    padding: 0;
    border-radius: 0;
  }

  blockquote {
    border-left: 3px solid var(--border);
    margin: 1em 0;
    padding: 0.5em 1em;
    font-style: italic;
    color: var(--text-muted);
  }

  blockquote p {
    margin: 0.5em 0;
  }

  hr {
    border: none;
    border-top: 1px solid var(--border);
    margin: 2em 0;
  }

  img {
    max-width: 100%;
    height: auto;
    display: block;
    margin: 1em 0;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    margin: 1em 0;
  }

  th, td {
    padding: 0.5em 0.75em;
    border: 1px solid var(--border);
    text-align: left;
  }

  th {
    background: var(--surface);
  }

  ul, ol {
    padding-left: 1.5em;
  }

  li {
    margin: 0.3em 0;
  }

  main {
    min-height: 60vh;
  }

  .text-muted {
    color: var(--text-muted);
  }

  .post-list {
    list-style: none;
    padding: 0;
  }

  .post-list li {
    margin: 0.75em 0;
  }

  .post-date {
    color: var(--text-muted);
    font-size: 0.9em;
    margin-right: 0.5em;
  }

  .tag {
    display: inline-block;
    background: var(--surface);
    padding: 0.15em 0.5em;
    border-radius: 3px;
    font-size: 0.85em;
    margin: 0.2em;
  }

  .meta {
    color: var(--text-muted);
    font-size: 0.9em;
    margin-bottom: 2em;
  }

  .pagination {
    margin-top: 2em;
    text-align: center;
  }

  .pagination a,
  .pagination span {
    margin: 0 0.3em;
  }
</style>
